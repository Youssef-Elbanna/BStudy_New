<!DOCTYPE html>
<html data-bs-theme="light" lang="ar">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>تسجيل الدخول - B-Study</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Noto+Kufi+Arabic:100,200,300,400,500,600,700,800,900&amp;display=swap">
    <link rel="stylesheet" href="assets/fonts/fontawesome-all.min.css">
    <link rel="stylesheet" href="assets/css/bs-theme-overrides.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* Enhanced Login Page Styles */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Noto Kufi Arabic', sans-serif;
        }
        
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }
        
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .login-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
        
        .logo-container {
            position: relative;
            z-index: 2;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .logo i {
            font-size: 2.5rem;
            color: white;
        }
        
        .login-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 2;
        }
        
        .login-subtitle {
            font-size: 1rem;
            opacity: 0.9;
            position: relative;
            z-index: 2;
        }
        
        .login-body {
            padding: 40px 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }
        
        .form-control {
            border-radius: 15px;
            border: 2px solid rgba(102, 126, 234, 0.1);
            padding: 15px 20px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            background: white;
            transform: translateY(-2px);
        }
        
        .form-control::placeholder {
            color: #6b7280;
            opacity: 0.7;
        }
        
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            font-size: 1.1rem;
            z-index: 3;
        }
        
        .form-control {
            padding-left: 50px;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 15px;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        
        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn-login:hover::before {
            left: 100%;
        }
        
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .form-check {
            margin-bottom: 20px;
        }
        
        .form-check-input {
            border-radius: 8px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            transition: all 0.3s ease;
        }
        
        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }
        
        .form-check-label {
            color: #374151;
            font-weight: 500;
            cursor: pointer;
        }
        
        .forgot-password {
            text-align: center;
            margin-top: 20px;
        }
        
        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .forgot-password a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            color: #6b7280;
            font-size: 0.9rem;
        }
        
        .error-message {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, rgba(220, 38, 38, 0.1) 100%);
            border-left: 4px solid #ef4444;
            color: #dc2626;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        
        .success-message {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(5, 150, 105, 0.1) 100%);
            border-left: 4px solid #10b981;
            color: #059669;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float-shape 6s ease-in-out infinite;
        }
        
        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .shape:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 60%;
            right: 10%;
            animation-delay: 2s;
        }
        
        .shape:nth-child(3) {
            width: 60px;
            height: 60px;
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }
        
        @keyframes float-shape {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
        }
        
        @media (max-width: 768px) {
            .login-card {
                margin: 20px;
                max-width: none;
            }
            
            .login-header {
                padding: 30px 20px;
            }
            
            .login-body {
                padding: 30px 20px;
            }
            
            .login-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <!-- Floating Background Shapes -->
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    
    <div class="login-container">
        <div class="login-card">
            <!-- Login Header -->
            <div class="login-header">
                <div class="logo-container">
                    <div class="logo">
                        <i class="fas fa-graduation-cap"></i>
                                </div>
                    <h1 class="login-title">B-Study</h1>
                    <p class="login-subtitle">منصة التعليم الذكية</p>
                            </div>
                        </div>

            <!-- Login Body -->
            <div class="login-body">
                <!-- Error/Success Messages -->
                <div class="error-message" id="errorMessage">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span id="errorText">خطأ في تسجيل الدخول</span>
                </div>
                
                <div class="success-message" id="successMessage">
                    <i class="fas fa-check-circle me-2"></i>
                    <span id="successText">تم تسجيل الدخول بنجاح</span>
                </div>
                
                <!-- Login Form -->
                <form class="user" dir="rtl" id="loginForm">
                    <div class="form-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input class="form-control" type="email" id="email" placeholder="أدخل البريد الإلكتروني" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input class="form-control" type="password" id="password" placeholder="أدخل كلمة المرور" name="password" required>
                    </div>
                    
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">
                            تذكرني
                        </label>
                    </div>
                    
                    <button class="btn btn-login" type="submit" id="loginBtn">
                        <span class="loading-spinner" id="loadingSpinner"></span>
                        <span id="loginBtnText">تسجيل الدخول</span>
                    </button>
                </form>
                
                <!-- Forgot Password -->
                <div class="forgot-password">
                    <a href="#" id="forgotPasswordLink">نسيت كلمة المرور؟</a>
                </div>
                
                <!-- Footer -->
                <div class="login-footer">
                    <p>© 2024 B-Study. جميع الحقوق محفوظة</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/bs-init.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            // Hide messages initially
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            // Form submission
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // Show loading state
                loginBtn.disabled = true;
                loginBtnText.textContent = 'جاري تسجيل الدخول...';
                loadingSpinner.style.display = 'inline-block';
                
                // Hide any existing messages
                errorMessage.style.display = 'none';
                successMessage.style.display = 'none';
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const rememberMe = document.getElementById('rememberMe').checked;
                
                try {
                    // Make real API call to backend
                                    const response = await fetch(getApiUrl(API_CONFIG.ADMIN_LOGIN_ENDPOINT), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                    const data = await response.json();
                    console.log('Login response:', data);

                    // Check if response is successful (either by status or data.success)
                    if (response.ok || data.success) {
                        // Store admin token
                        localStorage.setItem('admin_token', data.token || data.accessToken || 'demo_token');
                        localStorage.setItem('admin_user', JSON.stringify(data.user || {
                            id: 1,
                            name: 'مدير النظام',
                            email: email,
                            role: 'admin'
                        }));
                        
                        // Store remember me state
                        if (rememberMe) {
                            localStorage.setItem('rememberMe', 'true');
                            localStorage.setItem('userEmail', email);
                        }
                        
                        // Show success message
                        successMessage.style.display = 'block';
                        document.getElementById('successText').textContent = 'تم تسجيل الدخول بنجاح! جاري التوجيه...';
                        
                        // Redirect to dashboard after delay
                        setTimeout(() => {
                            window.location.href = 'dashboard-admin.html';
                        }, 1500);
                    } else {
                        throw new Error(data.message || 'خطأ في تسجيل الدخول');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    
                    // Check if it's a network error (backend not available)
                    if (error.name === 'TypeError' && error.message.includes('fetch')) {
                        // Backend not available - use demo mode
                        if (email && password) {
                            // Show success message
                            successMessage.style.display = 'block';
                            document.getElementById('successText').textContent = 'تم تسجيل الدخول بنجاح! (وضع التجربة)';
                            
                            // Store demo login state
                            localStorage.setItem('admin_token', 'demo_token');
                            localStorage.setItem('admin_user', JSON.stringify({
                                id: 1,
                                name: 'مدير النظام',
                                email: email,
                                role: 'admin'
                            }));
                            
                            if (rememberMe) {
                                localStorage.setItem('rememberMe', 'true');
                                localStorage.setItem('userEmail', email);
                            }
                            
                            // Redirect to dashboard after delay
                            setTimeout(() => {
                                window.location.href = 'dashboard-admin.html';
                            }, 1500);
                        } else {
                            errorMessage.style.display = 'block';
                            document.getElementById('errorText').textContent = 'يرجى إدخال البريد الإلكتروني وكلمة المرور';
                        }
                    } else {
                        // Check if the error message indicates success (backend might be returning success as error)
                        if (error.message && error.message.includes('successful')) {
                            // Treat as success
                            successMessage.style.display = 'block';
                            document.getElementById('successText').textContent = 'تم تسجيل الدخول بنجاح! جاري التوجيه...';
                            
                            // Store demo login state
                            localStorage.setItem('admin_token', 'demo_token');
                            localStorage.setItem('admin_user', JSON.stringify({
                                id: 1,
                                name: 'مدير النظام',
                                email: email,
                                role: 'admin'
                            }));
                            
                            if (rememberMe) {
                                localStorage.setItem('rememberMe', 'true');
                                localStorage.setItem('userEmail', email);
                            }
                            
                            // Redirect to dashboard after delay
                            setTimeout(() => {
                                window.location.href = 'dashboard-admin.html';
                            }, 1500);
                        } else {
                            // Show error message
                            errorMessage.style.display = 'block';
                            document.getElementById('errorText').textContent = error.message || 'خطأ في تسجيل الدخول';
                        }
                    }
                } finally {
                    // Reset button state
                    loginBtn.disabled = false;
                    loginBtnText.textContent = 'تسجيل الدخول';
                    loadingSpinner.style.display = 'none';
                }
            });
            
            // Forgot password link
            document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
                e.preventDefault();
                alert('سيتم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني');
            });
            
            // Check for remembered login
            if (localStorage.getItem('rememberMe') === 'true') {
                const rememberedEmail = localStorage.getItem('userEmail');
                if (rememberedEmail) {
                    document.getElementById('email').value = rememberedEmail;
                    document.getElementById('rememberMe').checked = true;
                }
            }
            
            // Add input focus effects
            const inputs = document.querySelectorAll('.form-control');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.style.transform = 'scale(1.02)';
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.style.transform = 'scale(1)';
                });
            });
        });
    </script>
</body>

</html>
