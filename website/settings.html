<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات - B-Study</title>
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="./styles/dashboard-layout.css">
    <link rel="stylesheet" href="./styles/dashboard-main.css">
    <link rel="stylesheet" href="./styles/settings.css">
</head>
<body dir="rtl">
    <header>
        <nav>
            <div class="logo">
                <div class="logo-content">
                    <img style="width: 45px; height: 45px" src="../asseds/images/logo.png" alt="B-Study Logo" />
                    <div class="logo-text">
                        <h3>B-Study</h3>
                        <span class="logo-subtitle">B-STUDY</span>
                    </div>
                </div>
            </div>
            <div class="header-info">
                <div class="account">
                    <div class="photo">
                        <img src="../asseds/images/avatar.jpg" alt="User Avatar" />
                        <div class="status-indicator"></div>
                    </div>
                    <div class="username">
                        <h5 class="welcome">مساء الخير</h5>
                        <h5 class="name"></h5>
                        <div class="info">
                            <h3 id="dashboard-username">مرحباً بك في B-Study</h3>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    
    <main>
        <div class="sidebar">
            <div class="top">
                <a class="sidebar-item" href="dashboard.html">
                    <img src="../asseds/icons/iconamoon_home.svg" alt="الرئيسية" />
                    <h5>الرئيسية</h5>
                </a>
                <a class="sidebar-item" href="./dashboard-mycourses.html">
                    <img src="../asseds/icons/lets-icons_video.svg" alt="كورساتي" />
                    <h5>كورساتي</h5>
                </a>
                <a class="sidebar-item" href="help.html">
                    <img src="../asseds/icons/bx_support.svg" alt="مساعدة" />
                    <h5>مساعدة</h5>
                </a>
                <a class="sidebar-item" href="privacy-policy.html">
                    <img src="../asseds/icons/iconoir_privacy-policy.svg" alt="سياسة الخصوصية" />
                    <h5>سياسة الخصوصية</h5>
                </a>
                <a class="sidebar-item selected" href="settings.html">
                    <img src="../asseds/icons/carbon_settings.svg" alt="الاعدادات" />
                    <h5>الاعدادات</h5>
                </a>
                <a class="sidebar-item" href="index.html" id="logout-btn">
                    <img src="../asseds/icons/ci_exit.svg" alt="خروج" />
                    <h5>خروج</h5>
                </a>
            </div>
        </div>
        
        <div class="content">
            <!-- Welcome Section -->
            <div class="welcome-section">
                <div class="welcome-header">
                    <div class="welcome-info">
                        <h1>إعدادات الحساب</h1>
                        <p>إدارة معلوماتك الشخصية وتفضيلاتك</p>
                    </div>
                    <div class="welcome-avatar">
                        <img src="../asseds/images/avatar2.png" alt="User Avatar" />
                    </div>
                </div>
            </div>

            <!-- Profile Section -->
            <div class="profile-section">
                <div class="section-header">
                    <div class="header-icon">
                        <img src="../asseds/icons/ic_outline-account-circle.svg" alt="الملف الشخصي" />
                    </div>
                    <div class="header-content">
                        <h2>الملف الشخصي</h2>
                        <p>إدارة معلومات حسابك</p>
                    </div>
                </div>
                
                <div class="profile-card">
                    <div class="profile-avatar">
                        <img src="../asseds/images/avatar.jpg" alt="صورة الملف الشخصي" />
                        <div class="avatar-overlay">
                            <img src="../asseds/icons/tabler_edit.svg" alt="تعديل" />
                        </div>
                    </div>
                    
                    <div class="profile-info">
                        <div class="info-group">
                            <label>الاسم</label>
                            <div class="info-value">
                                <span id="settings-username">مرحباً بك في B-Study</span>
                                <a href="settings-edit.html" class="edit-link">
                                    <img src="../asseds/icons/tabler_edit.svg" alt="تعديل" />
                                </a>
                            </div>
                        </div>
                        
                        <div class="info-group">
                            <label>البريد الإلكتروني</label>
                            <div class="info-value">
                                <span id="settings-email">استكشف الكورسات المتاحة</span>
                                <a href="settings-edit.html" class="edit-link">
                                    <img src="../asseds/icons/tabler_edit.svg" alt="تعديل" />
                                </a>
                            </div>
                        </div>
                        
                        <div class="info-group">
                            <label>الفئة</label>
                            <div class="info-value">
                                <span id="settings-category">طالب</span>
                                <a href="settings-edit.html" class="edit-link">
                                    <img src="../asseds/icons/tabler_edit.svg" alt="تعديل" />
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="profile-actions">
                    <a href="settings-edit.html" class="edit-profile-btn">
                        <img src="../asseds/icons/tabler_edit.svg" alt="تعديل" />
                        <span>تعديل معلومات الحساب</span>
                    </a>
                    
                    <button class="delete-account-btn" id="deleteAccountBtn">
                        <img src="../asseds/icons/ci_exit.svg" alt="حذف" />
                        <span>حذف الحساب</span>
                    </button>
                </div>
            </div>
        </div>
    </main>
    
    <script src="./javascript/dashboard.js"></script>
    <script src="config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadUserProfile();
            setupDeleteAccount();
        });

        async function loadUserProfile() {
            try {
                const token = localStorage.getItem('student_token');
                if (!token) {
                    // Not logged in, show default values
                    setDefaultUserInfo();
                    return;
                }

                const response = await fetch(getApiUrl(API_CONFIG.STUDENT_PROFILE_ME_ENDPOINT), {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const userData = await response.json();
                    updateUserInfo(userData);
                } else {
                    console.error('Failed to load user profile');
                    setDefaultUserInfo();
                }
            } catch (error) {
                console.error('Error loading user profile:', error);
                setDefaultUserInfo();
            }
        }

        function updateUserInfo(userData) {
            const usernameElem = document.getElementById('settings-username');
            const emailElem = document.getElementById('settings-email');
            const dashboardUsernameElem = document.getElementById('dashboard-username');

            if (usernameElem) {
                usernameElem.textContent = userData.username || 'غير محدد';
            }
            if (emailElem) {
                emailElem.textContent = userData.email || 'غير محدد';
            }
            if (dashboardUsernameElem) {
                dashboardUsernameElem.textContent = userData.username || 'مرحباً بك في B-Study';
            }

            // Update header username
            const headerNameElem = document.querySelector('.username .name');
            if (headerNameElem) {
                headerNameElem.textContent = userData.username || 'مرحباً بك في B-Study';
            }
        }

        function setDefaultUserInfo() {
            const usernameElem = document.getElementById('settings-username');
            const emailElem = document.getElementById('settings-email');
            const dashboardUsernameElem = document.getElementById('dashboard-username');

            if (usernameElem) {
                usernameElem.textContent = 'مرحباً بك في B-Study';
            }
            if (emailElem) {
                emailElem.textContent = 'استكشف الكورسات المتاحة';
            }
            if (dashboardUsernameElem) {
                dashboardUsernameElem.textContent = 'مرحباً بك في B-Study';
            }
        }

        function setupDeleteAccount() {
            const deleteAccountBtn = document.getElementById('deleteAccountBtn');
            if (deleteAccountBtn) {
                deleteAccountBtn.addEventListener('click', async function() {
                    const confirmed = confirm('هل أنت متأكد من حذف حسابك؟ هذا الإجراء لا يمكن التراجع عنه.');
                    if (!confirmed) return;
                    
                    try {
                        const token = localStorage.getItem('student_token');
                        if (!token) {
                            alert('يجب تسجيل الدخول أولاً');
                            return;
                        }
                        
                        const response = await fetch(getApiUrl(API_CONFIG.STUDENT_PROFILE_DELETE_ACCOUNT_ENDPOINT), {
                            method: 'DELETE',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            }
                        });
                        
                        if (response.ok) {
                            alert('تم حذف حسابك بنجاح');
                            localStorage.removeItem('student_token');
                            window.location.href = 'index.html';
                        } else {
                            const data = await response.json();
                            alert(data.message || 'حدث خطأ أثناء حذف الحساب');
                        }
                    } catch (error) {
                        console.error('Error deleting account:', error);
                        alert('حدث خطأ أثناء حذف الحساب');
                    }
                });
            }
        }
    </script>
</body>
</html>
